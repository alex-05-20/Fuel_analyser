name: Publier les archives annuelles
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuel-prices-sync
  cancel-in-progress: false
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: A1ex-C/fuel-analyser-data
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Télécharger les archives
        run: python -u -B -m scripts.download_annual
      - name: Préparer tous les carburants
        run: python -u -B -m scripts.prepare_annual
      - name: Publier et vérifier sur Hugging Face
        run: python -u -B -m scripts.upload_annual
